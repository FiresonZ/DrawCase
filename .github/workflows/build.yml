name: Build Windows Setup (DrawCase)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（例如 1.0.0）"
        required: true
        default: "1.0.0"
      publish:
        description: "是否发布 Release"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & (optional) Publish
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync version into source
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          (Get-Content src/drawcase/version_info.py) `
            -replace 'VERSION = ".*"', "VERSION = `"$v`"" |
            Set-Content src/drawcase/version_info.py
          (Get-Content src/drawcase/__init__.py) `
            -replace '__version__ = ".*"', "__version__ = `"$v`"" |
            Set-Content src/drawcase/__init__.py

      - name: Sync version into exe version resource
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          $parts = $v.Split('.')
          while ($parts.Count -lt 3) { $parts += "0" }
          $tuple = "($($parts[0]), $($parts[1]), $($parts[2]), 0)"
          $p = "assets/version_info.txt"
          $c = (Get-Content $p -Raw)
          $c = $c -replace [regex]::Escape("(0, 1, 0, 0)"), $tuple
          $c = $c -replace [regex]::Escape("'0.1.0"), "'$v"
          Set-Content $p $c
          Get-Content $p | Select-String "vers"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall -q src main.py

      - name: Smoke test (headless import check)
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -c "import drawcase, drawcase.taglib, drawcase.engine; print('ok', drawcase.__version__)"

      - name: Build with PyInstaller
        run: pyinstaller DrawCase.spec --noconfirm

      - name: Download Inno Setup Chinese language file
        shell: pwsh
        run: |
          # 主分支可能移动/移除该文件，依次尝试多个版本标签
          $urls = @(
            "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/ChineseSimplified.isl",
            "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_3_3/Files/Languages/Unofficial/ChineseSimplified.isl",
            "https://raw.githubusercontent.com/jrsoftware/issrc/is-6_2_2/Files/Languages/Unofficial/ChineseSimplified.isl"
          )
          $dest = "installer\ChineseSimplified.isl"
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile $dest -ErrorAction Stop
              Write-Host "OK: $u"
              break
            } catch {
              Write-Host "不可用: $u"
            }
          }
          if (-not (Test-Path $dest)) { throw "ChineseSimplified.isl 下载失败（所有源均 404）" }
          Get-Item $dest | Select-Object Length

      - name: Patch iss to use bundled language file
        shell: pwsh
        run: |
          $p = "installer/DrawCase.iss"
          (Get-Content $p -Raw) `
            -replace 'compiler:\\Languages\\ChineseSimplified\.isl', 'ChineseSimplified.isl' |
            Set-Content $p

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\DrawCase.iss"
          Get-ChildItem dist\installer

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: DrawCase-Setup-${{ github.event.inputs.version }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Create Release & upload setup exe
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: DrawCase v${{ github.event.inputs.version }}
          body: |
            ## DrawCase v${{ github.event.inputs.version }}

            - 本地 AI 生图工作台（Qwen-Image 系 / SDXL 系）
            - 内置 10 万条中文 Tag 库，双击插入提示词
            - 支持升级覆盖安装，AI 依赖、模型与作品保留

            作者: FiresonZ <dev@gith.uk>
          files: dist/installer/*.exe
          draft: false
          prerelease: false
